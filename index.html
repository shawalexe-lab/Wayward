<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wayward | WoW Forever</title>

  <style>

    /* =========================
       WAYWARD — COLOR SYSTEM
       ========================= */

    :root {
      --black: #0c0c0b;
      --charcoal: #151412;
      --bone: #d2c6ae;
      --bone-bright: #ddd1ba;
      --bone-muted: #918674;
      --red: #7b2820;
      --line: #302d28;
    }


    /* =========================
       BASIC RESET
       ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--bone);
      font-family: Georgia, "Times New Roman", serif;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7vw;

      background: rgba(12, 12, 11, 0.98);

      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--bone);

      font-size: 1.3rem;
      font-weight: 400;

      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;

      gap: 42px;
    }

    nav a {
      color: var(--bone-muted);

      text-decoration: none;
      text-transform: uppercase;

      letter-spacing: 0.22em;

      font-size: 0.72rem;

      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--bone);
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      min-height: calc(100vh - 78px);

      display: grid;

      grid-template-columns: 1.08fr 0.92fr;
    }


    /* =========================
       ARTIFACT SIDE
       ========================= */

    .artifact {
      position: relative;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 5vw;

      background:
        radial-gradient(
          circle at center,
          #1b1814 0%,
          #12110f 55%,
          #0c0c0b 100%
        );
    }

    .wayward-artifact {
      display: block;

      width: min(430px, 82%);
      height: auto;

      max-height: 75vh;

      object-fit: contain;

      filter:
        contrast(0.98)
        brightness(0.90);

      transform: rotate(-1deg);
    }

    .artifact-note {
      position: absolute;

      bottom: 38px;
      left: 7vw;

      color: var(--bone-muted);

      font-size: 0.65rem;

      letter-spacing: 0.22em;

      text-transform: uppercase;
    }


    /* =========================
       TEXT SIDE
       ========================= */

    .hero-copy {
      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        10vw
        9vw
        10vw
        7vw;

      background:
        radial-gradient(
          circle at 0% 50%,
          #181612 0%,
          var(--black) 55%
        );
    }

    .eyebrow {
      width: 38px;
      height: 2px;

      margin-bottom: 28px;

      background: var(--red);
    }

    h1 {
      color: var(--bone-bright);

      font-size:
        clamp(
          3.2rem,
          7vw,
          7.4rem
        );

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }

    .motto {
      margin-top: 36px;

      color: var(--bone);

      font-size:
        clamp(
          0.85rem,
          1.2vw,
          1.15rem
        );

      letter-spacing: 0.42em;

      text-transform: uppercase;
    }

    .intro {
      max-width: 470px;

      margin-top: 28px;

      color: var(--bone-muted);

      font-size: 1rem;

      line-height: 1.8;
    }


    /* =========================
       ENTER BUTTON
       ========================= */

    .enter {
      display: inline-block;

      width: fit-content;

      margin-top: 42px;

      padding:
        18px
        28px;

      border: 1px solid #625a4d;

      color: var(--bone);

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: 0.28em;

      font-size: 0.7rem;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .enter span {
      margin-left: 14px;

      color: var(--red);
    }

    .enter:hover {
      border-color: var(--bone-muted);

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 760px) {

      header {
        height: 66px;

        padding:
          0
          22px;
      }

      .brand {
        font-size: 1rem;

        letter-spacing: 0.3em;
      }

      nav {
        gap: 16px;
      }

      nav a {
        display: none;
      }

      nav a:last-child {
        display: block;
      }


      /* Stack artifact over text */

      .hero {
        min-height: auto;

        display: flex;

        flex-direction: column;
      }


      /* ARTIFACT */

      .artifact {
        min-height: 40vh;

        padding:
          35px
          25px
          45px;
      }

      .wayward-artifact {
        width:
          min(
            245px,
            67vw
          );

        max-height: 34vh;

        object-fit: contain;

        transform: rotate(-1deg);
      }

      .artifact-note {
        left: 22px;

        bottom: 18px;

        font-size: 0.58rem;

        letter-spacing: 0.2em;
      }


      /* TEXT */

      .hero-copy {
        min-height: 52vh;

        padding:
          50px
          26px
          75px;
      }

      .eyebrow {
        margin-bottom: 26px;
      }

      h1 {
        font-size:
          clamp(
            3rem,
            16vw,
            5rem
          );

        letter-spacing: 0.08em;
      }

      .motto {
        margin-top: 30px;

        line-height: 1.7;

        letter-spacing: 0.3em;
      }

      .intro {
        margin-top: 24px;

        font-size: 0.95rem;

        line-height: 1.8;
      }

      .enter {
        margin-top: 36px;

        padding:
          17px
          23px;
      }
    }

  </style>
</head>


<body>


  <!-- =======================
       NAVIGATION
       ======================= -->

  <header>

    <div class="brand">
      Wayward
    </div>

    <nav>

      <a href="#about">
        About
      </a>

      <a href="#people">
        People
      </a>

      <a href="#share">
        The Share
      </a>

      <a href="#join">
        Join
      </a>

    </nav>

  </header>


  <!-- =======================
       WAYWARD HERO
       ======================= -->

  <main class="hero">


    <!-- ARTIFACT -->

    <section class="artifact">

      <img
        class="wayward-artifact"
        src="wayward-mark.png.PNG"
        alt="The Wayward Mark: an engraved lantern with a ruffled feather hanging beneath it"
      >

      <div class="artifact-note">
        The Wayward Mark
      </div>

    </section>


    <!-- INTRODUCTION -->

    <section class="hero-copy">

      <div class="eyebrow"></div>

      <h1>
        Wayward
      </h1>

      <div class="motto">
        Find your way.
      </div>

      <p class="intro">
        A Horde community built on shared effort,
        mutual support, and the belief that the road
        is better traveled together.
      </p>

      <a
        class="enter"
        href="#about"
      >
        Enter Wayward

        <span>
          →
        </span>

      </a>

    </section>


  </main>


</body>

</html>
