<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wayward | WoW Forever</title>

  <style>
    :root {
      --black: #0c0c0b;
      --charcoal: #151412;
      --bone: #d2c6ae;
      --bone-muted: #918674;
      --red: #7b2820;
      --line: #302d28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--bone);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
    }

    /* HEADER */

    header {
      height: 78px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7vw;
      background: rgba(12, 12, 11, 0.97);
    }

    .brand {
      font-size: 1.3rem;
      letter-spacing: .35em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 42px;
    }

    nav a {
      color: var(--bone-muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: .72rem;
      transition: color .2s ease;
    }

    nav a:hover {
      color: var(--bone);
    }

    /* HERO */

    .hero {
      min-height: calc(100vh - 78px);
      display: grid;
      grid-template-columns: 1.08fr .92fr;
    }

    .artifact {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(12,12,11,.05),
          rgba(12,12,11,.38)
        ),
        #1a1815;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8vw;
    }

    /* Temporary artifact until we add our final artwork */

    .bone {
      width: min(300px, 60%);
      aspect-ratio: .55;
      background: #b8aa8d;
      border-radius: 45% 40% 44% 42% / 4% 5% 7% 6%;
      transform: rotate(-4deg);
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
      position: relative;
      opacity: .9;
    }

    .bone::before {
      content: "☼";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #28231d;
      font-size: 5rem;
      opacity: .55;
    }

    .artifact-note {
      position: absolute;
      bottom: 38px;
      left: 7vw;
      font-size: .65rem;
      letter-spacing: .2em;
      color: var(--bone-muted);
      text-transform: uppercase;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10vw 9vw 10vw 7vw;
      background:
        radial-gradient(
          circle at 0% 50%,
          #181612 0,
          var(--black) 55%
        );
    }

    .eyebrow {
      width: 38px;
      height: 2px;
      background: var(--red);
      margin-bottom: 28px;
    }

    h1 {
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: clamp(3.2rem, 7vw, 7.4rem);
      line-height: .9;
      color: #d8cdb7;
    }

    .motto {
      margin-top: 36px;
      text-transform: uppercase;
      letter-spacing: .42em;
      font-size: clamp(.85rem, 1.2vw, 1.15rem);
    }

    .intro {
      max-width: 470px;
      margin-top: 28px;
      color: var(--bone-muted);
      line-height: 1.8;
      font-size: 1rem;
    }

    .enter {
      display: inline-block;
      width: fit-content;
      margin-top: 42px;
      border: 1px solid #625a4d;
      padding: 18px 28px;
      color: var(--bone);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .28em;
      font-size: .7rem;
      transition:
        border-color .2s ease,
        background .2s ease;
    }

    .enter span {
      color: var(--red);
      margin-left: 14px;
    }

    .enter:hover {
      border-color: var(--bone-muted);
      background: rgba(255,255,255,.025);
    }

    /* MOBILE */

    @media (max-width: 760px) {

      header {
        height: 66px;
        padding: 0 22px;
      }

      .brand {
        font-size: 1rem;
      }

      nav {
        gap: 16px;
      }

      nav a {
        display: none;
      }

      nav a:last-child {
        display: block;
      }

      .hero {
        min-height: auto;
        display: flex;
        flex-direction: column;
      }

      .artifact {
        min-height: 46vh;
        padding: 70px 30px;
      }

      .bone {
        width: 150px;
      }

      .artifact-note {
        left: 22px;
        bottom: 20px;
      }

      .hero-copy {
        min-height: 54vh;
        padding: 60px 26px 75px;
      }

      h1 {
        font-size: clamp(3rem, 17vw, 5rem);
        letter-spacing: .08em;
      }

      .motto {
        letter-spacing: .3em;
        line-height: 1.7;
      }

      .intro {
        font-size: .95rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">Wayward</div>

    <nav>
      <a href="#">About</a>
      <a href="#">People</a>
      <a href="#">The Share</a>
      <a href="#">Join</a>
    </nav>
  </header>

  <main class="hero">

    <section class="artifact">

      <div class="bone"></div>

      <div class="artifact-note">
        The Wayward Mark
      </div>

    </section>

    <section class="hero-copy">

      <div class="eyebrow"></div>

      <h1>Wayward</h1>

      <div class="motto">
        Find your way.
      </div>

      <p class="intro">
        A Horde community built on shared effort,
        mutual support, and the belief that the road
        is better traveled together.
      </p>

      <a class="enter" href="#about">
        Enter Wayward <span>→</span>
      </a>

    </section>

  </main>

</body>
</html>
