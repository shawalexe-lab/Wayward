<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0c0c0b"
  >

  <title>Wayward | WoW Forever</title>

  <style>

    /* =========================
       WAYWARD
       ========================= */

    :root {
      --black: #0c0c0b;
      --deep-black: #090908;
      --charcoal: #151412;

      --bone: #d2c6ae;
      --bone-bright: #ddd1ba;
      --bone-muted: #918674;

      --red: #7b2820;

      --line: #302d28;
      --line-light: #554e43;
    }


    /* =========================
       RESET
       ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      min-height: 100vh;

      overflow-x: hidden;

      background: var(--black);

      color: var(--bone);

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      position: relative;
      z-index: 10;

      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7vw;

      background: var(--black);

      border-bottom:
        1px solid
        var(--line);
    }

    .brand {
      color: var(--bone);

      font-size: 1.25rem;
      font-weight: 400;

      letter-spacing: 0.34em;

      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;

      gap: 42px;
    }

    nav a {
      color: var(--bone-muted);

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: 0.22em;

      font-size: 0.7rem;

      transition:
        color 0.2s ease;
    }

    nav a:hover {
      color: var(--bone);
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      min-height:
        calc(100vh - 78px);

      display: grid;

      grid-template-columns:
        1.05fr
        0.95fr;

      background: var(--black);
    }


    /* =========================
       ARTIFACT
       ========================= */

    .artifact {
      position: relative;

      min-width: 0;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 4vw;

      background:
        radial-gradient(
          ellipse at 52% 47%,
          #1b1814 0%,
          #12110f 48%,
          #0c0c0b 78%
        );
    }

    .wayward-artifact {
      display: block;

      width:
        min(
          500px,
          88%
        );

      max-height: 78vh;

      height: auto;

      object-fit: contain;

      filter:
        contrast(0.98)
        brightness(0.91);

      transform:
        rotate(-0.7deg);
    }

    .artifact-note {
      position: absolute;

      left: 7vw;
      bottom: 34px;

      color: var(--bone-muted);

      font-size: 0.61rem;

      letter-spacing: 0.24em;

      text-transform: uppercase;
    }


    /* =========================
       HERO COPY
       ========================= */

    .hero-copy {
      position: relative;

      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding:
        9vw
        8vw
        9vw
        6vw;

      background:
        radial-gradient(
          ellipse at 0% 48%,
          #171511 0%,
          #0c0c0b 58%
        );
    }

    .eyebrow {
      width: 42px;
      height: 2px;

      margin-bottom: 32px;

      background: var(--red);
    }

    h1 {
      color: var(--bone-bright);

      font-size:
        clamp(
          3.4rem,
          6.4vw,
          7rem
        );

      font-weight: 400;

      line-height: 0.92;

      letter-spacing: 0.13em;

      text-transform: uppercase;
    }

    .motto {
      margin-top: 36px;

      color: var(--bone);

      font-size:
        clamp(
          0.82rem,
          1.1vw,
          1.08rem
        );

      letter-spacing: 0.4em;

      line-height: 1.7;

      text-transform: uppercase;
    }

    .intro {
      max-width: 450px;

      margin-top: 27px;

      color: var(--bone-muted);

      font-size: 0.98rem;

      line-height: 1.85;
    }


    /* =========================
       ENTER
       ========================= */

    .enter {
      position: relative;

      display: inline-flex;

      align-items: center;

      width: fit-content;

      margin-top: 38px;

      padding:
        15px
        0
        11px;

      color: var(--bone);

      border-bottom:
        1px solid
        var(--line-light);

      text-decoration: none;

      text-transform: uppercase;

      letter-spacing: 0.27em;

      font-size: 0.67rem;

      transition:
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .enter span {
      margin-left: 17px;

      color: var(--red);

      transition:
        transform 0.2s ease;
    }

    .enter:hover {
      color: var(--bone-bright);

      border-color:
        var(--bone-muted);
    }

    .enter:hover span {
      transform:
        translateX(4px);
    }


    /* =========================
       MOBILE
       ========================= */

    @media
    (max-width: 760px) {

      header {
        height: 64px;

        padding:
          0
          22px;
      }

      .brand {
        font-size: 0.94rem;

        letter-spacing: 0.29em;
      }

      nav {
        gap: 0;
      }

      nav a {
        display: none;
      }

      nav a:last-child {
        display: block;

        font-size: 0.62rem;

        letter-spacing: 0.2em;
      }


      /* HERO STACK */

      .hero {
        min-height: auto;

        display: flex;

        flex-direction: column;
      }


      /* ARTIFACT */

      .artifact {
        min-height: 42vh;

        padding:
          24px
          18px
          44px;

        background:
          radial-gradient(
            ellipse at center,
            #191713 0%,
            #11100e 58%,
            #0c0c0b 100%
          );
      }

      .wayward-artifact {
        width:
          min(
            300px,
            78vw
          );

        max-height: 38vh;

        object-fit: contain;

        transform:
          rotate(-0.7deg);
      }

      .artifact-note {
        left: 24px;
        bottom: 16px;

        font-size: 0.55rem;

        letter-spacing: 0.22em;
      }


      /* COPY */

      .hero-copy {
        min-height: 50vh;

        padding:
          52px
          25px
          72px;

        background:
          linear-gradient(
            to bottom,
            #0d0d0b 0%,
            #0c0c0b 22%,
            #0c0c0b 100%
          );
      }

      .eyebrow {
        width: 39px;

        margin-bottom: 30px;
      }

      h1 {
        max-width: 100%;

        font-size:
          clamp(
            2.9rem,
            13.2vw,
            4.35rem
          );

        line-height: 0.95;

        letter-spacing: 0.075em;

        white-space: nowrap;
      }

      .motto {
        margin-top: 31px;

        font-size: 0.8rem;

        letter-spacing: 0.3em;

        line-height: 1.7;
      }

      .intro {
        max-width: 340px;

        margin-top: 24px;

        font-size: 0.94rem;

        line-height: 1.85;
      }

      .enter {
        margin-top: 31px;

        padding:
          13px
          0
          10px;

        font-size: 0.64rem;

        letter-spacing: 0.25em;
      }
    }


    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media
    (max-width: 390px) {

      h1 {
        font-size: 2.85rem;

        letter-spacing: 0.06em;
      }

      .wayward-artifact {
        width: 275px;
      }

    }

  </style>
</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="brand">
      Wayward
    </div>

    <nav>

      <a href="#about">
        About
      </a>

      <a href="#people">
        People
      </a>

      <a href="#share">
        The Share
      </a>

      <a href="#join">
        Join
      </a>

    </nav>

  </header>


  <!-- HERO -->

  <main class="hero">


    <!-- WAYWARD ARTIFACT -->

    <section class="artifact">

      <img
        class="wayward-artifact"
        src="wayward-mark.png.PNG"
        alt="The Wayward Mark: an engraved lantern with a ruffled feather hanging beneath it"
      >

      <div class="artifact-note">
        The Wayward Mark
      </div>

    </section>


    <!-- WAYWARD INTRO -->

    <section class="hero-copy">

      <div class="eyebrow"></div>

      <h1>
        Wayward
      </h1>

      <div class="motto">
        Find your way.
      </div>

      <p class="intro">
        A Horde community built on shared effort,
        mutual support, and the belief that the road
        is better traveled together.
      </p>

      <a
        class="enter"
        href="#about"
      >
        Enter Wayward

        <span>
          →
        </span>

      </a>

    </section>


  </main>


</body>

</html>
